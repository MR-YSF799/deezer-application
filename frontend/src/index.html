<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deezer Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Variables & Reset ─────────────────────────────────────────────────── */
    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --card:      #16161f;
      --border:    #1e1e2e;
      --accent:    #a78bfa;
      --accent2:   #f472b6;
      --green:     #34d399;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Bruit de fond ──────────────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-right { display: flex; gap: 0.75rem; align-items: center; }

    /* ── Boutons ─────────────────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem; font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Spinner ─────────────────────────────────────────────────────────────── */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Hero ────────────────────────────────────────────────────────────────── */
    .hero {
      position: relative;
      padding: 4rem 2rem 3rem;
      text-align: center;
      overflow: hidden;
    }

    .hero-glow {
      position: absolute;
      width: 600px; height: 300px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      pointer-events: none;
    }
    .glow-1 { background: var(--accent); top: -100px; left: 20%; }
    .glow-2 { background: var(--accent2); top: -80px; right: 15%; }

    .hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(3rem, 8vw, 6rem);
      letter-spacing: 0.04em;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--muted);
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    /* ── Barre de contrôles ──────────────────────────────────────────────────── */
    .controls {
      max-width: 900px; margin: 0 auto;
      padding: 0 2rem 2rem;
      display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1; min-width: 200px;
      position: relative;
    }

    .search-icon {
      position: absolute; left: 0.9rem; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      padding: 0.55rem 1rem 0.55rem 2.4rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #searchInput:focus { border-color: var(--accent); }
    #searchInput::placeholder { color: var(--muted); }

    /* ── Stats bar ───────────────────────────────────────────────────────────── */
    #statsBar {
      max-width: 900px; margin: 0 auto;
      padding: 0 2rem 1.5rem;
      display: none; gap: 2rem;
    }
    #statsBar.visible { display: flex; }

    .stat {
      display: flex; flex-direction: column;
      font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
    }
    .stat strong { font-size: 1.4rem; color: var(--text); font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.04em; }

    /* ── Toast ───────────────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 2rem; right: 2rem; z-index: 999;
      padding: 0.75rem 1.2rem;
      border-radius: var(--radius);
      font-size: 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      transform: translateY(120%);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
      max-width: 300px;
    }
    #toast.show { transform: translateY(0); }
    #toast.success { border-color: var(--green); color: var(--green); }
    #toast.error   { border-color: #f87171; color: #f87171; }

    /* ── État vide / erreur ──────────────────────────────────────────────────── */
    #status {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    #status .status-icon { font-size: 3rem; margin-bottom: 1rem; }
    #status h3 { font-weight: 500; margin-bottom: 0.5rem; color: var(--text); }
    #status p  { font-size: 0.9rem; }

    /* ── Grille de cards ─────────────────────────────────────────────────────── */
    #tracksGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
      max-width: 1200px; margin: 0 auto;
      padding: 0 2rem 4rem;
    }

    /* ── Card ────────────────────────────────────────────────────────────────── */
    .track-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      animation: fadeIn 0.4s ease both;
    }
    .track-card:hover {
      transform: translateY(-4px);
      border-color: rgba(167,139,250,0.35);
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-cover {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
    }
    .card-cover img {
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .track-card:hover .card-cover img { transform: scale(1.06); }

    .rank-badge {
      position: absolute; top: 0.6rem; left: 0.6rem;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
      font-size: 0.7rem; font-weight: 500;
      color: var(--accent);
    }

    .play-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.35);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .track-card:hover .play-overlay { opacity: 1; }
    .play-overlay svg { filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6)); }

    .card-body {
      padding: 1rem;
    }

    .card-title {
      font-weight: 500;
      font-size: 0.95rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .card-artist {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 0.75rem;
    }

    .card-artist span {
      color: var(--accent);
      font-weight: 500;
    }

    /* ── Mini player audio ────────────────────────────────────────────────────── */
    .audio-player {
      display: flex; align-items: center; gap: 0.6rem;
    }

    .play-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
    }
    .play-btn:hover { transform: scale(1.1); }
    .play-btn.playing { opacity: 0.85; }

    .progress-wrap {
      flex: 1; position: relative; height: 4px;
      background: var(--border); border-radius: 999px;
      cursor: pointer; overflow: hidden;
    }
    .progress-bar {
      position: absolute; left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .duration {
      font-size: 0.72rem;
      color: var(--muted);
      flex-shrink: 0;
      width: 36px;
      text-align: right;
    }

    /* ── Player global ───────────────────────────────────────────────────────── */
    #globalPlayer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      padding: 0.75rem 2rem;
      display: none;
      align-items: center; gap: 1rem;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    #globalPlayer.visible {
      display: flex;
      transform: translateY(0);
    }

    #gp-cover {
      width: 44px; height: 44px;
      border-radius: 6px; object-fit: cover;
      flex-shrink: 0;
    }
    #gp-info { flex: 0 0 auto; min-width: 120px; max-width: 200px; }
    #gp-title { font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #gp-artist { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #gp-progress-wrap {
      flex: 1; height: 4px;
      background: var(--border); border-radius: 999px;
      cursor: pointer; overflow: hidden;
    }
    #gp-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 999px;
      width: 0%;
      transition: width 0.1s linear;
    }

    #gp-time { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }

    #gp-close {
      background: none; border: none;
      color: var(--muted); cursor: pointer;
      padding: 0.25rem; font-size: 1.1rem;
    }
    #gp-close:hover { color: var(--text); }
  </style>
</head>
<body>

<!-- ── Header ───────────────────────────────────────────────────────────────── -->
<header>
  <div class="logo">🎵 Charts</div>
  <div class="header-right">
    <button class="btn btn-outline" id="refreshBtn" onclick="fetchTracks()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      Charger
    </button>
    <button class="btn btn-primary" id="syncBtn" onclick="syncDeezer()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      Sync Deezer
    </button>
  </div>
</header>

<!-- ── Hero ─────────────────────────────────────────────────────────────────── -->
<section class="hero">
  <div class="hero-glow glow-1"></div>
  <div class="hero-glow glow-2"></div>
  <h1>Top Tracks</h1>
  <p>Powered by Deezer &nbsp;·&nbsp; Stocké dans MongoDB</p>
</section>

<!-- ── Contrôles ────────────────────────────────────────────────────────────── -->
<div class="controls">
  <div class="search-wrap">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="searchInput" placeholder="Titre, artiste, album..." oninput="handleSearch(this.value)" />
  </div>
  <button class="btn btn-outline" id="clearSearchBtn" onclick="clearSearch()" style="display:none">✕ Effacer</button>
</div>

<!-- ── Stats ────────────────────────────────────────────────────────────────── -->
<div id="statsBar">
  <div class="stat"><strong id="stat-count">0</strong>Tracks</div>
  <div class="stat"><strong id="stat-artists">0</strong>Artistes</div>
</div>

<!-- ── Contenu principal ────────────────────────────────────────────────────── -->
<div id="status">
  <div class="status-icon">🎵</div>
  <h3>Aucune donnée chargée</h3>
  <p>Cliquez sur <strong>Sync Deezer</strong> pour récupérer les charts, ou <strong>Charger</strong> si vous avez déjà synchronisé.</p>
</div>

<div id="tracksGrid"></div>

<!-- ── Toast ─────────────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<!-- ── Global Player ────────────────────────────────────────────────────────── -->
<div id="globalPlayer">
  <img id="gp-cover" src="" alt="" />
  <div id="gp-info">
    <div id="gp-title">—</div>
    <div id="gp-artist">—</div>
  </div>
  <div id="gp-progress-wrap" onclick="seekGlobal(event)">
    <div id="gp-progress-bar"></div>
  </div>
  <div id="gp-time">0:00</div>
  <button id="gp-close" onclick="closeGlobalPlayer()" title="Fermer">✕</button>
</div>

<!-- ── Hidden audio element ──────────────────────────────────────────────────── -->
<audio id="mainAudio"></audio>

<script>
  const API = window.location.origin.includes('localhost')
    ? 'http://localhost:3000'
    : '/api-backend'; // ajustez si proxy nginx configuré différemment

  const audio = document.getElementById('mainAudio');
  let currentCardId = null;
  let searchTimeout = null;

  /* ── Utils ──────────────────────────────────────────────────────────────── */
  function fmtDuration(sec) {
    const m = Math.floor(sec / 60);
    const s = String(sec % 60).padStart(2, '0');
    return `${m}:${s}`;
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.className = '', 3000);
  }

  function setLoading(btnId, loading) {
    const btn = document.getElementById(btnId);
    if (loading) {
      btn._html = btn.innerHTML;
      btn.innerHTML = '<div class="spinner"></div> Chargement...';
      btn.disabled = true;
    } else {
      btn.innerHTML = btn._html || btn.innerHTML;
      btn.disabled = false;
    }
  }

  /* ── Fetch tracks depuis la BDD ─────────────────────────────────────────── */
  async function fetchTracks() {
    setLoading('refreshBtn', true);
    try {
      const res = await fetch(`${API}/api/tracks`);
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      renderTracks(json.data);
      if (json.count === 0) showToast('Base vide — cliquez sur Sync Deezer', 'error');
      else showToast(`${json.count} tracks chargées ✓`);
    } catch (e) {
      showToast('Erreur : ' + e.message, 'error');
      showStatus('error', '⚠️', 'Impossible de contacter le backend', `${API}/api/tracks inaccessible`);
    } finally {
      setLoading('refreshBtn', false);
    }
  }

  /* ── Sync depuis Deezer → BDD ───────────────────────────────────────────── */
  async function syncDeezer() {
    setLoading('syncBtn', true);
    try {
      const res = await fetch(`${API}/api/fetch`, { method: 'POST' });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);
      showToast(`${json.message} (${json.inserted} nouvelles)`);
      await fetchTracks();
    } catch (e) {
      showToast('Sync échouée : ' + e.message, 'error');
    } finally {
      setLoading('syncBtn', false);
    }
  }

  /* ── Recherche ──────────────────────────────────────────────────────────── */
  function handleSearch(q) {
    clearTimeout(searchTimeout);
    document.getElementById('clearSearchBtn').style.display = q ? '' : 'none';
    searchTimeout = setTimeout(async () => {
      if (!q.trim()) { fetchTracks(); return; }
      try {
        const res = await fetch(`${API}/api/tracks/search?q=${encodeURIComponent(q)}`);
        const json = await res.json();
        renderTracks(json.data);
      } catch (e) { showToast('Recherche échouée', 'error'); }
    }, 300);
  }

  function clearSearch() {
    document.getElementById('searchInput').value = '';
    document.getElementById('clearSearchBtn').style.display = 'none';
    fetchTracks();
  }

  /* ── Rendu ──────────────────────────────────────────────────────────────── */
  function showStatus(type, icon, title, desc) {
    document.getElementById('status').style.display = '';
    document.getElementById('tracksGrid').innerHTML = '';
    document.getElementById('statsBar').classList.remove('visible');
    document.getElementById('status').innerHTML = `
      <div class="status-icon">${icon}</div>
      <h3>${title}</h3>
      <p>${desc}</p>`;
  }

  function renderTracks(tracks) {
    const grid = document.getElementById('tracksGrid');
    const status = document.getElementById('status');
    const statsBar = document.getElementById('statsBar');

    if (!tracks.length) {
      showStatus('empty', '🔍', 'Aucun résultat', 'Essayez un autre mot-clé.');
      return;
    }

    status.style.display = 'none';
    statsBar.classList.add('visible');

    const artists = new Set(tracks.map(t => t.artist?.name).filter(Boolean));
    document.getElementById('stat-count').textContent = tracks.length;
    document.getElementById('stat-artists').textContent = artists.size;

    grid.innerHTML = tracks.map((t, i) => `
      <div class="track-card" id="card-${t.deezerId}" style="animation-delay:${Math.min(i * 0.03, 0.5)}s">
        <div class="card-cover">
          <img src="${t.album?.cover || 'https://via.placeholder.com/300?text=♪'}" alt="${t.album?.title || ''}" loading="lazy" />
          <span class="rank-badge">#${t.rank || i+1}</span>
          <div class="play-overlay">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="white"><circle cx="24" cy="24" r="24" fill="rgba(0,0,0,0.5)"/><polygon points="19,14 37,24 19,34" fill="white"/></svg>
          </div>
        </div>
        <div class="card-body">
          <div class="card-title" title="${t.title}">${t.title}</div>
          <div class="card-artist"><span>${t.artist?.name || '—'}</span> · ${t.album?.title || '—'}</div>
          ${t.preview ? `
          <div class="audio-player">
            <button class="play-btn" id="btn-${t.deezerId}" onclick="togglePlay('${t.deezerId}','${t.preview}',${JSON.stringify(t).replace(/'/g,"\\'")})" title="Écouter le preview">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
            </button>
            <div class="progress-wrap" id="pw-${t.deezerId}" onclick="seekTrack(event,'${t.deezerId}')">
              <div class="progress-bar" id="pb-${t.deezerId}"></div>
            </div>
            <span class="duration" id="dur-${t.deezerId}">${fmtDuration(t.duration || 30)}</span>
          </div>` : `<div style="font-size:0.75rem;color:var(--muted);">Pas de preview disponible</div>`}
        </div>
      </div>`).join('');
  }

  /* ── Audio Player ───────────────────────────────────────────────────────── */
  function togglePlay(id, url, track) {
    const btn = document.getElementById(`btn-${id}`);
    if (currentCardId === id && !audio.paused) {
      audio.pause();
      setPlayIcon(id, false);
      currentCardId = null;
      return;
    }
    if (currentCardId && currentCardId !== id) {
      setPlayIcon(currentCardId, false);
      document.getElementById(`pb-${currentCardId}`).style.width = '0%';
    }
    audio.src = url;
    audio.play().catch(() => showToast('Preview indisponible', 'error'));
    currentCardId = id;
    setPlayIcon(id, true);
    updateGlobalPlayer(track);
  }

  function setPlayIcon(id, playing) {
    const btn = document.getElementById(`btn-${id}`);
    if (!btn) return;
    btn.classList.toggle('playing', playing);
    btn.innerHTML = playing
      ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="white"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`
      : `<svg width="14" height="14" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>`;
  }

  function seekTrack(e, id) {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  }

  function seekGlobal(e) {
    if (!audio.duration) return;
    const rect = e.currentTarget.getBoundingClientRect();
    audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
  }

  function updateGlobalPlayer(track) {
    const gp = document.getElementById('globalPlayer');
    document.getElementById('gp-cover').src = track.album?.cover || '';
    document.getElementById('gp-title').textContent = track.title;
    document.getElementById('gp-artist').textContent = track.artist?.name || '—';
    gp.classList.add('visible');
  }

  function closeGlobalPlayer() {
    audio.pause();
    if (currentCardId) { setPlayIcon(currentCardId, false); currentCardId = null; }
    document.getElementById('globalPlayer').classList.remove('visible');
  }

  /* ── Audio events ───────────────────────────────────────────────────────── */
  audio.addEventListener('timeupdate', () => {
    if (!audio.duration || !currentCardId) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    const pb = document.getElementById(`pb-${currentCardId}`);
    if (pb) pb.style.width = pct + '%';
    document.getElementById('gp-progress-bar').style.width = pct + '%';
    document.getElementById('gp-time').textContent = fmtDuration(Math.floor(audio.currentTime));
  });

  audio.addEventListener('ended', () => {
    if (currentCardId) {
      setPlayIcon(currentCardId, false);
      document.getElementById(`pb-${currentCardId}`).style.width = '0%';
      currentCardId = null;
    }
    document.getElementById('gp-progress-bar').style.width = '0%';
  });

  /* ── Init ───────────────────────────────────────────────────────────────── */
  fetchTracks();
</script>
</body>
</html>
