# ========================================
# Configuration Nginx pour le Frontend Deezer
# ========================================
# Ce serveur Nginx fait 3 choses :
# 1. Sert les fichiers HTML/JS/CSS (frontend)
# 2. Fait un proxy vers le backend Node.js pour les requêtes /api/
# 3. Optimise les performances (compression, cache)

server {
    # Écoute les connexions HTTP sur le port 80
    listen 80;
    
    # S'applique pour les requêtes destinées à "localhost"
    server_name localhost;

    # ========================================
    # CONFIGURATION DE BASE DU SERVEUR STATIQUE
    # ========================================
    
    # Répertoire racine : où sont situés les fichiers HTML/JS/CSS du frontend
    root /usr/share/nginx/html;
    
    # Fichier par défaut à servir si on accède à un dossier (ex: "/" → "index.html")
    index index.html;

    # ========================================
    # COMPRESSION GZIP (Optimisation)
    # ========================================
    # Active la compression Gzip pour réduire la taille des fichiers transmis
    gzip on;
    
    # Types de fichiers à compresser (les fichiers texte et JSON sont compressibles)
    gzip_types text/plain text/css application/javascript application/json;

    # ========================================
    # ROUTE 1 : Servir le Frontend (Single Page Application)
    # ========================================
    location / {
        # try_files : essaie les fichiers dans cet ordre :
        # 1. Cherche le fichier exact ($uri)
        # 2. Cherche un dossier exact ($uri/)
        # 3. Si rien n'existe, redirige tout vers /index.html (pour les routes React/Vue/Angular)
        #    Cela permet à la SPA de gérer le routing côté client
        try_files $uri $uri/ /index.html;
    }

    # ========================================
    # ROUTE 2 : Proxy vers le Backend Node.js (Routes API)
    # ========================================
    location /api/ {
        # Toutes les requêtes vers /api/* sont redirigées au backend
        # "backend" est le nom de service Docker défini dans docker-compose.yml
        # Port 3000 : port d'écoute du serveur Node.js
        proxy_pass         http://backend:3000;
        
        # Version du protocole HTTP pour la communication avec le backend
        proxy_http_version 1.1;

        # ========== En-têtes Proxy ==========
        # Preserve le nom d'hôte original (pas le nom du service Docker)
        proxy_set_header   Host              $host;
        
        # Envoie l'adresse IP réelle du client (ne pas laisser le backend voir l'IP de Nginx)
        proxy_set_header   X-Real-IP         $remote_addr;
        
        # Liste chaîne des IPs par lesquelles la requête a transité (Nginx → Backend)
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        
        # Vide la connexion (pour éviter les problèmes de keep-alive avec Nginx)
        proxy_set_header   Connection        "";

        # ========== Timeouts ==========
        # Temps max pour établir la connexion avec le backend (10 secondes)
        # Les appels Deezer peuvent être lents, donc on donne du délai
        proxy_connect_timeout 10s;
        
        # Temps max pour recevoir une réponse du backend (30 secondes)
        # Les appels à l'API Deezer peuvent être lents
        proxy_read_timeout    30s;

        # NOTE: CORS est géré par le backend (dans server.js)
        # On ne configure pas CORS ici pour éviter les conflits
    }

    # ========================================
    # ROUTE 3 : Health Check du Backend
    # ========================================
    # Endpoint spécial pour vérifier si le backend est en vie
    # Utilisé par Docker ou les load balancers
    location /health {
        proxy_pass http://backend:3000/health;
    }

    # ========================================
    # CACHING DES FICHIERS STATIQUES (Optimisation)
    # ========================================
    # Regex : ~* = case-insensitive matching
    # Extensions ciblées : JS, CSS, images, polices (ne changent pas souvent)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        # Cache les fichiers pendant 7 jours dans le navigateur client
        expires 7d;
        
        # Directive Cache-Control :
        # "public" = peut être cachée par les proxies et navigateurs
        # "immutable" = le fichier ne changera jamais (car il a un hash dans son nom)
        add_header Cache-Control "public, immutable";
    }
}
