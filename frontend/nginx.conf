server {
    listen 80;
    server_name localhost;

    # Servir les fichiers statiques du frontend
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Route principale → frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le backend Node.js pour toutes les routes /api/*
    # "backend" est le nom du service Docker défini dans docker-compose.yml
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";

        # Timeout généreux pour les appels Deezer
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;

        # CORS géré par le backend, on ne duplique pas ici
    }

    # Route health backend
    location /health {
        proxy_pass http://backend:3000/health;
    }

    # Fichiers statiques en cache longue durée
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
